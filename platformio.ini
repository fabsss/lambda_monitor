[env:esp32s3]
platform = espressif32 @ ~6.10.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
extra_scripts =
    pre:tools/embed_frontend.py
    post:tools/ota_upload.py
board_build.partitions = partitions.csv
build_flags =
    -Wall
    -Wextra

[env:test_native]
platform = native
test_framework = unity
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Ilib
